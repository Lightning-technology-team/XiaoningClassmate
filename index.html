<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表情包展示平台</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
    <!-- 主配置 -->
    <script src="./config.js">
    </script>
    <!-- 历史版本配置 -->
    <script src="./versions.js">
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        accent: '#ec4899',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .glass {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .card-hover {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .card-hover:hover {
                transform: translateY(-8px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
            .version-item {
                transition: all 0.2s ease;
            }
            .version-item:hover {
                background: #f8f7ff;
                transform: translateX(4px);
            }
            .badge-current {
                background: linear-gradient(135deg, #6366f1, #8b5cf6);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen">

    <!-- ====== 导航栏 ====== -->
    <nav class="glass sticky top-0 z-50 border-b border-white/20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- 左侧 Logo -->
                <div class="flex items-center">
                    <i class="fa fa-smile-o text-2xl text-primary mr-3"></i>
                    <h1 id="siteTitle" class="text-xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">
                        表情包展示平台
                    </h1>
                </div>

                <!-- 右侧操作区 -->
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <!-- 下载全部 -->
                    <button id="downloadAllBtn" class="bg-gradient-to-r from-primary to-secondary text-white px-4 py-2 rounded-full font-medium shadow-lg hover:shadow-xl transition-all duration-300 flex items-center text-sm sm:text-base">
                        <i class="fa fa-download mr-1 sm:mr-2"></i>
                        <span class="hidden sm:inline">下载全部</span>
                        <span class="sm:hidden">全部</span>
                    </button>

                    <!-- 历史版本 -->
                    <button id="versionsBtn" class="border-2 border-primary text-primary hover:bg-primary hover:text-white px-4 py-2 rounded-full font-medium transition-all duration-300 flex items-center text-sm sm:text-base">
                        <i class="fa fa-history mr-1 sm:mr-2"></i>
                        <span class="hidden sm:inline">历史版本</span>
                        <span class="sm:hidden">历史</span>
                    </button>

                    <!-- 更新日志 -->
                    <a id="changelogLink" href="./README.md" target="_blank" class="text-gray-600 hover:text-primary transition-colors flex items-center text-sm sm:text-base px-2 py-2 rounded-full hover:bg-white/50">
                        <i class="fa fa-file-text-o mr-1 sm:mr-2"></i>
                        <span class="hidden sm:inline">更新日志</span>
                        <span class="sm:hidden">日志</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ====== 主要内容 ====== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- 统计信息 -->
        <div class="text-center mb-12">
            <h2 id="pageSubtitle" class="text-3xl font-bold text-gray-800 mb-2">精选表情包合集</h2>
            <p class="text-gray-500" id="stats">正在加载表情包...</p>
        </div>

        <!-- 表情包网格 -->
        <div id="emojiGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="hidden text-center py-20">
            <i class="fa fa-folder-open-o text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">暂无表情包</p>
        </div>
    </main>

    <!-- ====== 图片查看器模态框 ====== -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <button id="closeModal" class="absolute top-4 right-4 text-white text-3xl hover:text-gray-300 transition-colors">
            <i class="fa fa-times"></i>
        </button>
        <img id="modalImage" src="" alt="表情包大图" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl" />
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex space-x-4">
            <a id="downloadSingleBtn" href="" download class="bg-white text-gray-800 px-6 py-2 rounded-full font-medium shadow-lg hover:shadow-xl transition-all duration-300 flex items-center">
                <i class="fa fa-download mr-2"></i>
                下载此图
            </a>
        </div>
    </div>

    <!-- ====== 历史版本模态框 ====== -->
    <div id="versionsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden">
            <!-- 模态框头部 -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 flex-shrink-0">
                <h3 class="text-xl font-bold text-gray-800 flex items-center">
                    <i class="fa fa-history text-primary mr-3"></i>
                    历史版本
                </h3>
                <button id="closeVersionsModal" class="text-gray-400 hover:text-gray-600 text-2xl transition-colors">
                    <i class="fa fa-times"></i>
                </button>
            </div>

            <!-- 版本列表 -->
            <div id="versionsList" class="px-6 py-4 overflow-y-auto flex-1">
                <!-- 由 JavaScript 动态渲染 -->
                <div class="text-center py-8 text-gray-400">
                    <i class="fa fa-spinner fa-spin text-2xl mr-2"></i>
                    加载版本信息...
                </div>
            </div>

            <!-- 模态框底部 -->
            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between flex-shrink-0 flex-wrap gap-2">
                <span class="text-sm text-gray-400">选择版本下载压缩包</span>
                <a id="changelogModalLink" href="./README.md" target="_blank" class="text-primary hover:text-secondary transition-colors flex items-center text-sm font-medium">
                    <i class="fa fa-file-text-o mr-2"></i>
                    查看完整更新日志
                </a>
            </div>
        </div>
    </div>

    <!-- ====== 页脚 ====== -->
    <footer class="mt-20 py-8 border-t border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-500">
            <p id="footerText">© 2025 表情包展示平台 | 所有表情包仅供个人使用</p>
        </div>
    </footer>

    <script>
        // ============================================================
        //  主脚本
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {

            // ---------- 检查主配置 ----------
            if (typeof siteConfig === 'undefined') {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('stats').textContent = '配置文件加载失败，请检查 config.js 是否存在';
                return;
            }

            // ---------- 应用网站配置 ----------
            applySiteConfig();

            // ---------- 加载表情包 ----------
            loadEmojis();

            // ---------- 加载历史版本 ----------
            loadVersions();

            // ---------- 设置事件监听 ----------
            setupEventListeners();
        });

        // ============================================================
        //  应用网站配置
        // ============================================================
        function applySiteConfig() {
            document.title = siteConfig.siteTitle;
            document.getElementById('siteTitle').textContent = siteConfig.siteTitle;
            document.getElementById('pageSubtitle').textContent = siteConfig.pageSubtitle;
            document.getElementById('footerText').textContent = siteConfig.footerText;
        }

        // ============================================================
        //  加载表情包
        // ============================================================
        function loadEmojis() {
            const emojiFiles = siteConfig.emojiFiles || [];

            if (emojiFiles.length === 0) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('stats').textContent = '请在 config.js 中添加表情包文件名';
                return;
            }

            document.getElementById('loading').classList.add('hidden');
            const grid = document.getElementById('emojiGrid');
            grid.innerHTML = '';

            emojiFiles.forEach((filename, index) => {
                const card = createEmojiCard(filename, index);
                grid.appendChild(card);
            });

            document.getElementById('stats').textContent = `共 ${emojiFiles.length} 个精选表情包`;
        }

        // ============================================================
        //  创建表情包卡片
        // ============================================================
        function createEmojiCard(filename, index) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl overflow-hidden shadow-md card-hover';
            card.style.animationDelay = (index * 0.05) + 's';

            const img = document.createElement('img');
            img.src = siteConfig.photosFolder + '/' + filename;
            img.alt = '表情包 ' + (index + 1);
            img.className = 'w-full h-48 object-cover cursor-pointer transition-transform duration-300 hover:scale-110';
            img.loading = 'lazy';

            img.onerror = function() {
                this.src =
                    'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiBmaWxsPSIjRjNGNEY2Ii8+CjxwYXRoIGQ9Ik0xMiA5VjE1IiBzdHJva2U9IiM5NEEzQjYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+CjxjaXJjbGUgY3g9IjEyIiBjeT0iNiIgcj0iMSIgZmlsbD0iIzk0QTNCNiIvPgo8L3N2Zz4=';
                this.classList.add('p-8');
            };

            img.addEventListener('click', function() {
                openModal(siteConfig.photosFolder + '/' + filename, filename);
            });

            card.appendChild(img);
            return card;
        }

        // ============================================================
        //  加载历史版本
        // ============================================================
        function loadVersions() {
            const list = document.getElementById('versionsList');

            // 检查 versionConfig 是否存在
            if (typeof versionConfig === 'undefined') {
                list.innerHTML = `
                        <div class="text-center py-8 text-gray-400">
                            <i class="fa fa-exclamation-triangle text-2xl mr-2"></i>
                            未找到版本配置，请创建 versions.js
                        </div>
                    `;
                return;
            }

            const versions = versionConfig.versions || [];
            if (versions.length === 0) {
                list.innerHTML = `
                        <div class="text-center py-8 text-gray-400">
                            <i class="fa fa-inbox text-2xl mr-2"></i>
                            暂无历史版本
                        </div>
                    `;
                return;
            }

            // 渲染版本列表
            let html = '<div class="space-y-3">';
            versions.forEach(function(item, index) {
                const isLatest = (index === 0);
                const badgeHtml = isLatest ?
                    '<span class="badge-current text-white text-xs font-semibold px-2 py-0.5 rounded-full ml-2">最新</span>' :
                    '';

                html += `
                        <div class="version-item flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border border-gray-100 bg-white shadow-sm">
                            <div class="flex items-center flex-wrap gap-1 mb-2 sm:mb-0">
                                <span class="font-bold text-gray-800 text-base">${escapeHtml(item.version)}</span>
                                ${badgeHtml}
                                <span class="text-gray-400 text-sm ml-2">${escapeHtml(item.date)}</span>
                                <span class="w-full sm:w-auto text-gray-600 text-sm mt-1 sm:mt-0 sm:ml-4">${escapeHtml(item.description || '')}</span>
                            </div>
                            <a href="./${escapeHtml(item.filename)}" download
                               class="bg-primary hover:bg-secondary text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors flex items-center self-start sm:self-center">
                                <i class="fa fa-download mr-1.5"></i>
                                下载
                            </a>
                        </div>
                    `;
            });
            html += '</div>';

            list.innerHTML = html;

            // 更新模态框底部的更新日志链接
            const link = document.getElementById('changelogModalLink');
            if (versionConfig.changelogLink) {
                link.href = versionConfig.changelogLink;
            }
            // 导航栏中的更新日志链接
            const navLink = document.getElementById('changelogLink');
            if (versionConfig.changelogLink) {
                navLink.href = versionConfig.changelogLink;
            }
        }

        // ============================================================
        //  工具：转义 HTML
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  图片模态框
        // ============================================================
        function openModal(imageSrc, filename) {
            document.getElementById('modalImage').src = imageSrc;
            document.getElementById('downloadSingleBtn').href = imageSrc;
            document.getElementById('downloadSingleBtn').download = filename;
            document.getElementById('imageModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModalFunc() {
            document.getElementById('imageModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        // ============================================================
        //  历史版本模态框
        // ============================================================
        function openVersionsModal() {
            document.getElementById('versionsModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeVersionsModalFunc() {
            document.getElementById('versionsModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        // ============================================================
        //  设置事件监听器
        // ============================================================
        function setupEventListeners() {
            // ----- 图片模态框 -----
            document.getElementById('closeModal').addEventListener('click', closeModalFunc);
            document.getElementById('imageModal').addEventListener('click', function(e) {
                if (e.target === this) closeModalFunc();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && !document.getElementById('imageModal').classList.contains('hidden')) {
                    closeModalFunc();
                }
            });

            // ----- 历史版本模态框 -----
            document.getElementById('versionsBtn').addEventListener('click', openVersionsModal);
            document.getElementById('closeVersionsModal').addEventListener('click', closeVersionsModalFunc);
            document.getElementById('versionsModal').addEventListener('click', function(e) {
                if (e.target === this) closeVersionsModalFunc();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && !document.getElementById('versionsModal').classList.contains('hidden')) {
                    closeVersionsModalFunc();
                }
            });

            // ----- 下载全部 -----
            document.getElementById('downloadAllBtn').addEventListener('click', function() {
                const zipPackages = siteConfig.zipPackages || [];

                if (zipPackages.length === 0) {
                    alert('暂无可用的 ZIP 包，请在 config.js 中添加 zipPackages 配置');
                    return;
                }

                if (zipPackages.length === 1) {
                    window.location.href = siteConfig.zipsFolder + '/' + zipPackages[0].filename;
                    return;
                }

                showZipSelection();
            });
        }

        // ============================================================
        //  ZIP 包选择菜单
        // ============================================================
        function showZipSelection() {
            const menu = document.createElement('div');
            menu.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';
            menu.id = 'zipMenu';

            const content = document.createElement('div');
            content.className = 'bg-white rounded-xl p-6 max-w-md w-full shadow-2xl';

            const title = document.createElement('h3');
            title.className = 'text-xl font-bold text-gray-800 mb-4';
            title.textContent = '选择要下载的合集';

            const list = document.createElement('div');
            list.className = 'space-y-3';

            siteConfig.zipPackages.forEach(function(pkg) {
                const item = document.createElement('a');
                item.href = siteConfig.zipsFolder + '/' + pkg.filename;
                item.className =
                    'block w-full text-left px-4 py-3 rounded-lg bg-gray-50 hover:bg-gray-100 transition-colors flex items-center';
                item.innerHTML = '<i class="fa fa-file-archive-o text-primary mr-3"></i> ' + escapeHtml(pkg.name);

                item.addEventListener('click', function() {
                    document.body.removeChild(menu);
                });

                list.appendChild(item);
            });

            const cancelBtn = document.createElement('button');
            cancelBtn.className =
                'mt-4 w-full px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors';
            cancelBtn.textContent = '取消';
            cancelBtn.addEventListener('click', function() {
                document.body.removeChild(menu);
            });

            content.appendChild(title);
            content.appendChild(list);
            content.appendChild(cancelBtn);
            menu.appendChild(content);

            menu.addEventListener('click', function(e) {
                if (e.target === menu) {
                    document.body.removeChild(menu);
                }
            });

            document.body.appendChild(menu);
        }
    </script>
</body>
</html>
